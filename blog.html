          "p": "The previous version of this site never got far: the nav linked to «Writing» and «Projects», two files that never existed, so every click landed on a 404. Three cards on the home page pointed at `games.html`, `downloads.html` and `other.html` — none of those either. The remaining pages still carried `your-username`, `your@email.com` and a self-introduction that was never mine."
        },
        {
          "p": "None of that was a design problem. It was **unfinished work**. So the rewrite went in order: make what already exists solid, then talk about looks."
        },
        {
          "h": "Constraints first"
        },
        {
          "ol": [
            "Every page is a self-contained HTML file — replace one file, ship one change. No build artifacts in production, no `node_modules`",
            "No fonts or icons from a CDN, no analytics script",
            "Two colour themes and four UI languages (zh-CN, zh-TW, en, ja), orthogonal to each other"
          ]
        },
        {
          "p": "The first two were uncontroversial. The third one was not."
        },
        {
          "h": "Shared source, standalone output"
        },
        {
          "p": "«Single file» and «avoid copy-paste» seem to contradict each other: five pages carrying five copies of the stylesheet means recolouring takes five edits."
        },
        {
          "p": "The fix is to separate **source** from **output**. `src/core.css` and `src/core.js` are the only truth; each file under `src/pages/` declares its own copy, data and render function; `node src/build.js` expands the shared shell into every page and writes it out to `site/`."
        },
        {
          "code": "src/\n  core.css        design tokens + component styles\n  core.js         i18n / theme / nav / reveal\n  pages/\n    10-index.js\n    20-projects.js\n    30-blog.js\n    40-about.js\n    90-404.js\n  build.js        assembles and writes site/*.html"
        },
        {
          "p": "What gets uploaded is still five independent HTML files, none of them referencing each other. Change the palette once, rebuild, done."
        },
        {
          "h": "Two traps"
        },
        {
          "p": "**FOUC.** If the theme is resolved after CSS lands, dark-mode users get one frame of a light background. The few lines that decide the theme now live in `\u003chead>`, before the stylesheet. Once `data-theme` is on `\u003chtml>`, everything later is synchronous."
        },
        {
          "p": "**localStorage in private mode.** Safari private browsing throws on read and write. An uncaught throw kills the whole script, which looks exactly like «the language switcher does nothing». Every access is wrapped in `try / catch`: a failed read falls back to the default, a failed write only costs the memory."
        },
        {
          "h": "Structured prose only"
        },
        {
          "p": "Article bodies are arrays of blocks — `{p: paragraph}`, `{h: heading}`, `{code: listing}`, `{ul: list}` — turned into HTML by `renderBlocks()`. Text is escaped before any formatting, and links pass through `safeUrl()`, so a `javascript:` pseudo-protocol never reaches an `\u003ca href>`. It reads like Markdown without pulling in a parser."
        },
        {
          "h": "Still missing"
        },
        {
          "p": "Traditional Chinese and Japanese currently cover UI strings only; article bodies fall back to Simplified Chinese. Filling the gap is data work: add a `body` for that language to the `POSTS` entry, no logic involved."
        },
        {
          "note": "This page is itself a product of that rewrite, including its own source."
        }
      ]
    }

    "summary": {
      "zh-CN": "404 页是站点里唯一一个由平台触发的页面。它值得比一句「页面不存在」多做点事。",

        {
          "p": "GitHub Pages 认根目录下的 `404.html`。文件名叫 404，但内容完全是普通 HTML —— 也就是说它可以有导航、有样式、有脚本，跟首页一样体面。"
        },
        {
          "h": "链接必须是根绝对路径"

        {
          "p": "这是最容易踩的一条。用户可能访问 `/notes/draft/index.html` 这样多层的错误路径，此时页面里写 `href=\"index.html\"` 会被解析成 `/notes/draft/index.html`，**在 404 页里再触发一个 404**。"

        },
        {
          "code": "\u003c!-- 只在 404.html 里这么写 -->\n\u003ca href=\"/index.html\">首页\u003c/a>\n\u003ca href=\"/blog.html\">文章\u003c/a>"
        },
        {
          "h": "别让访客走进死胡同"
        },
        {
          "p": "一个有用的 404 至少给出三件事：这是怎么回事（而不是「出错了」）、现在能做什么、以及如果链接本该有效，该反馈给谁。"

      "en": [
        {
          "p": "GitHub Pages serves whatever sits in `404.html` at the repository root. The name says 404, but the file is ordinary HTML — it can have navigation, styles and scripts, and be as presentable as the home page."
        },
        {
          "h": "Links must be root-absolute"
        },
        {
          "p": "This is the easiest one to get wrong. A visitor might hit a nested path like `/notes/draft/index.html`, where `href=\"index.html\"` resolves to `/notes/draft/index.html` — **a 404 page that 404s again**."
        },
        {

          "h": "Do not trap the visitor"

        {
          "p": "修了两次之后我确认，问题不在某一行代码，在界面层选错了。于是有了 6.0.1：保留 Python 的处理逻辑，把界面换成 HTML + CSS + JavaScript，用 pywebview 装进桌面窗口。"

/* ============================================================
   本页渲染逻辑
   ============================================================ */
window.PAGE_RENDER = function(ctx) {
        var POSTS = (window.PAGE_DATA || []).slice().sort(function (a, b) {
            return String(b.date).localeCompare(String(a.date));
        });

        var listHead = document.getElementById('listHead');
        var listView = document.getElementById('listView');
        var postView = document.getElementById('postView');
        var listEl = document.getElementById('postList');
        var bar = document.getElementById('postFilters');
        var empty = document.getElementById('postEmpty');
        var content = document.getElementById('postContent');
        var count = document.getElementById('postCount');
        if (!listEl) return;

        var active = '';

        /* 中日文按字符估读取时长，其他语言按词 */
        function minutes(text) {
            var cjk = (text.match(/[㐀-䶿一-鿿぀-ヿ가-힯]/g) || []).length;
            var words = (text.replace(/[㐀-䶿一-鿿぀-ヿ가-힯]/g, '').match(/[A-Za-z0-9']+/g) || []).length;
            return Math.max(1, Math.round((cjk / 320 + words / 220) || 1));
        }

        function plainText(post) {
            var parts = [];
            (ctx.pick(post.body) || []).forEach(function (b) {
                if (b.p) parts.push(b.p);
                if (b.h) parts.push(b.h);
                if (b.note) parts.push(b.note);
                if (b.quote) parts.push(b.quote);
                if (b.ul) parts = parts.concat(b.ul);
                if (b.ol) parts = parts.concat(b.ol);
            });
            return parts.join(' ');
        }

        function meta(post, withTags) {
            var mins = minutes(plainText(post));
            var row = '<div class="post-meta">' +
                '<time datetime="' + escHtml(post.date) + '">' + escHtml(post.date) + '</time>' +
                '<span class="sep" aria-hidden="true"></span>' +
                '<span>' + mins + ' ' + ctx.t('c_min_read') + '</span>' +
                (post.draft ? '<span class="sep" aria-hidden="true"></span><span class="status status-archived">' + ctx.t('draft') + '</span>' : '') +
                '</div>';
            if (withTags) {
                row += '<ul class="tag-list">' + (post.tags || []).map(function (t) {
                    return '<li><span class="tag">' + escHtml(t) + '</span></li>';
                }).join('') + '</ul>';
            }
            return row;
        }

        function renderList() {
            var items = POSTS.filter(function (p) {
                if (p.draft) return false;
                return !active || (p.tags || []).indexOf(active) >= 0;
            });
            listEl.innerHTML = items.map(function (p) {
                return '<a class="post-row reveal" href="#/post/' + encodeURIComponent(p.slug) + '">' +
                    '<h2>' + escHtml(ctx.pick(p.title)) + '</h2>' +
                    meta(p, false) +
                    '<p>' + escHtml(ctx.pick(p.summary)) + '</p>' +
                    (p.tags && p.tags.length ? '<ul class="tag-list">' + p.tags.map(function (t) {
                        return '<li><span class="tag">' + escHtml(t) + '</span></li>';
                    }).join('') + '</ul>' : '') +
                    '</a>';
            }).join('\n');
            empty.hidden = items.length !== 0;
            if (count) count.textContent = ctx.t('count_label').replace('%d', items.length);
            if (window.SITE_RUNTIME) window.SITE_RUNTIME.reveal();
        }

        function renderPost(slug) {
            var idx = POSTS.findIndex(function (p) { return p.slug === slug; });
            if (idx < 0) return false;
            var post = POSTS[idx];
            var blocks = (post.body && (post.body[ctx.lang()] || post.body['zh-CN'] || post.body.en)) || [];

            var prev = POSTS[idx + 1];
            var next = POSTS[idx - 1];
            var nav = '';
            if (prev || next) {
                nav = '<div class="navpair">' +
                    (prev ? '<a class="linkcard" href="#/post/' + encodeURIComponent(prev.slug) + '"><small>← ' + ctx.t('nav_older') + '</small><span>' + escHtml(ctx.pick(prev.title)) + '</span></a>' : '<span class="linkcard" style="visibility:hidden"></span>') +
                    (next ? '<a class="linkcard" href="#/post/' + encodeURIComponent(next.slug) + '" style="text-align:right"><small>' + ctx.t('nav_newer') + ' →</small><span>' + escHtml(ctx.pick(next.title)) + '</span></a>' : '<span class="linkcard" style="visibility:hidden"></span>') +
                    '</div>';
            }

            content.innerHTML =
                '<header class="post-head">' +
                '<h1>' + escHtml(ctx.pick(post.title)) + '</h1>' +
                meta(post, true) +
                '</header>' +
                '<div class="post-body prose">' + renderBlocks(blocks) + '</div>' +
                '<hr class="divider" />' +
                '<footer class="post-foot">' + nav +
                '<button type="button" class="back-top" id="backTop">' + ctx.t('back_top') + '</button>' +
                '</footer>';

            var backTop = document.getElementById('backTop');
            if (backTop) backTop.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.title = ctx.pick(post.title) + ' · ' + ctx.t('brand');
            listHead.hidden = true;
            listView.hidden = true;
            postView.hidden = false;
            return true;
        }

        function showList() {
            listHead.hidden = false;
            listView.hidden = false;
            postView.hidden = true;
            document.title = ctx.t('doc_title');
            renderList();
        }

        function route() {
            var m = location.hash.match(/^#\/post\/([^/?]+)/);
            if (m) {
                var slug;
                try { slug = decodeURIComponent(m[1]); }
                catch (error) { showList(); return; }
                if (renderPost(slug)) {
                    window.scrollTo({ top: 0, behavior: 'auto' });
                    return;
                }
            }
            showList();
        }

        /* 标签筛选 */
        var tags = [];
        POSTS.forEach(function (p) {
            (p.tags || []).forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); });
        });
        if (tags.length > 1) {
            bar.hidden = false;
            bar.innerHTML = '<button type="button" class="pill" aria-pressed="true" data-tag="">' + ctx.t('c_all') + '</button>' +
                tags.map(function (t) {
                    return '<button type="button" class="pill" aria-pressed="false" data-tag="' + escHtml(t) + '">' + escHtml(t) + '</button>';
                }).join('') +
                '<span class="count" id="postCount"></span>';
            Array.prototype.forEach.call(bar.querySelectorAll('.pill'), function (pill) {
                pill.addEventListener('click', function () {
                    active = pill.getAttribute('data-tag');
                    Array.prototype.forEach.call(bar.querySelectorAll('.pill'), function (x) {
                        x.setAttribute('aria-pressed', String(x === pill));
                    });
                    if (location.hash) { location.hash = ''; return; }
                    renderList();
                });
            });
        }

        document.getElementById('backToList').onclick = function () {
            if (location.hash) location.hash = '';
            else showList();
        };

        window.onhashchange = route;
        count = document.getElementById('postCount');
        route();
    };
    </script>

        email: '',          /* 想公开邮箱就填在这里，关于页会自动出现邮件按钮 */
        year: 2026

    /* ── 2. 外壳文案（导航、页脚、无障碍标签） ───────────────── */
    /* 兜底语言为 zh-CN：其余语言缺失的键会自动回退到它 */

        'zh-CN': {
            doc_title: '云陌轩',

        },
        'zh-TW': {

            brand: '雲陌軒',
            nav_home: '首頁', nav_projects: '項目', nav_blog: '文章', nav_about: '關於',

            a11y_menu: '開啟選單', a11y_menu_close: '關閉選單', a11y_footer: '頁尾',

            c_updated: '更新於', c_min_read: '分鐘閱讀', c_empty: '這裡還空著。', c_tags: '標籤'
        },
        'en': {
            doc_title: 'Yunmo-Xuan',
            brand: 'Yunmo-Xuan',
            nav_home: 'Home', nav_projects: 'Projects', nav_blog: 'Writing', nav_about: 'About',
            a11y_skip: 'Skip to main content', a11y_theme: 'Toggle light and dark theme',
            a11y_lang: 'Choose language', a11y_menu: 'Open menu', a11y_menu_close: 'Close menu',
            a11y_footer: 'Footer',

            footer_github: 'GitHub profile', footer_source: 'Site source', footer_feedback: 'Report an issue',

            c_updated: 'Updated', c_min_read: 'min read', c_empty: 'Nothing here yet.', c_tags: 'Tags'
        },
        'ja': {
            doc_title: '雲陌軒',
            brand: '雲陌軒',
            nav_home: 'ホーム', nav_projects: 'プロジェクト', nav_blog: 'ノート', nav_about: '概要',
            a11y_skip: '本文へスキップ', a11y_theme: 'ライト／ダークを切替',
            a11y_lang: '言語を選択', a11y_menu: 'メニューを開く', a11y_menu_close: 'メニューを閉じる',
            a11y_footer: 'フッター',
            footer_tagline: '一人分の静的サイト、ゆっくり更新。',
            footer_copyright: '© 2026 雲陌軒 · 無断転載を禁じます',
            footer_github: 'GitHub', footer_source: 'サイトのソース', footer_feedback: '問題を報告',
            c_github: 'GitHub', c_back_home: 'ホームへ', c_all: 'すべて', c_read_more: '続きを読む',
            c_updated: '更新日', c_min_read: '分で読了', c_empty: 'まだ何もありません。', c_tags: 'タグ'
        }
    };
    var LANGS = ['zh-CN', 'zh-TW', 'en', 'ja'];
    var LANG_LABEL = { 'zh-CN': '简体中文', 'zh-TW': '繁體中文', 'en': 'English', 'ja': '日本語' };

    var PAGE = window.PAGE_I18N || {};
    var T = {};
    LANGS.forEach(function (code) {
        T[code] = Object.assign({}, CHROME[code] || {}, PAGE[code] || {});
    });

    /* ── 3. 存储（隐私模式下 localStorage 会抛错） ───────────── */
    function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function write(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

    /* ── 4. 多语言 ───────────────────────────────────────────── */
    var root = document.documentElement;
    var lang = read('preferredLanguage');
    if (LANGS.indexOf(lang) < 0) {
        var nav = (navigator.language || 'zh-CN').replace('_', '-');
        if (LANGS.indexOf(nav) >= 0) lang = nav;
        else if (nav.indexOf('zh') === 0) lang = (/(TW|HK|MO)/.test(nav) ? 'zh-TW' : 'zh-CN');
        else if (nav.indexOf('ja') === 0) lang = 'ja';
        else if (nav.indexOf('en') === 0) lang = 'en';
        else lang = 'zh-CN';
    }

    function t(key) {
        var value = T[lang][key];
        if (value === undefined) value = T['zh-CN'][key];
        return value;
    }

    /* 从数据表里取当前语言的文案，取不到则回退 zh-CN 再回退首个可用值 */
    function pick(fields) {
        if (!fields) return '';
        if (typeof fields === 'string') return fields;
        var value = fields[lang];
        if (value === undefined) value = fields['zh-CN'];
        if (value === undefined) {
            var keys = Object.keys(fields);
            value = keys.length ? fields[keys[0]] : '';
        }
        return value;
    }

    /* 字典内容都是本文件内手写的静态文案，不含任何用户输入，
       因此允许 <strong>/<br/> 这类排版标记 */
    function applyText(el, key) {
        var value = t(key);
        if (typeof value === 'string') el.innerHTML = value;
    }

    function applyLang(next) {
        if (LANGS.indexOf(next) >= 0) lang = next;
        write('preferredLanguage', lang);
        root.setAttribute('lang', lang);
        document.title = t('doc_title');

        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
            applyText(el, el.getAttribute('data-i18n'));
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
            var value = t(el.getAttribute('data-i18n-aria'));
            if (typeof value === 'string') el.setAttribute('aria-label', value);
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function (el) {
            var value = t(el.getAttribute('data-i18n-title'));
            if (typeof value === 'string') el.setAttribute('title', value);
        });

        var metaDesc = document.getElementById('metaDesc');
        if (metaDesc) {
            var desc = t('meta_description');
            if (typeof desc === 'string') metaDesc.setAttribute('content', desc);
        }

        var label = document.getElementById('currentLangLabel');
        if (label) label.textContent = LANG_LABEL[lang] || lang;
        Array.prototype.forEach.call(document.querySelectorAll('#langDropdown [data-lang]'), function (item) {
            item.setAttribute('aria-checked', String(item.getAttribute('data-lang') === lang));
        });

        document.body.classList.add('lang-ready');
        if (typeof window.PAGE_RENDER === 'function') {
            window.PAGE_RENDER({ lang: function () { return lang; }, t: t, pick: pick, site: SITE });
        }
    }

    var langToggle = document.getElementById('langToggle');
    var langDropdown = document.getElementById('langDropdown');

    function closeLang() {
        langDropdown.classList.remove('show');
        langToggle.setAttribute('aria-expanded', 'false');
    }

    langToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = langDropdown.classList.toggle('show');
        langToggle.setAttribute('aria-expanded', String(open));
        if (open) {
            var first = langDropdown.querySelector('[data-lang]');
            if (first) first.focus();
        }
    });
    Array.prototype.forEach.call(langDropdown.querySelectorAll('[data-lang]'), function (item) {
        item.addEventListener('click', function (e) {
            e.preventDefault();
            applyLang(item.getAttribute('data-lang'));
            closeLang();
            langToggle.focus();
        });
    });
    document.addEventListener('click', function (e) {
        if (!langDropdown.contains(e.target) && e.target !== langToggle) closeLang();
    });

    /* ── 5. 主题 ─────────────────────────────────────────────── */
    var themeToggle = document.getElementById('themeToggle');
    var metaTheme = document.getElementById('metaThemeColor');
    var themeExplicit = read('preferredTheme') === 'light' || read('preferredTheme') === 'dark';

    function applyTheme(mode) {
        root.setAttribute('data-theme', mode);
        if (metaTheme) metaTheme.setAttribute('content', mode === 'dark' ? '#0e1116' : '#faf9f8');
    }
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    themeToggle.addEventListener('click', function () {
        themeExplicit = true;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        write('preferredTheme', next);
        applyTheme(next);
    });

    /* 未手动选择过主题时跟随系统 */
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var follow = function (e) { if (!themeExplicit) applyTheme(e.matches ? 'dark' : 'light'); };
    if (mq.addEventListener) mq.addEventListener('change', follow);
    else if (mq.addListener) mq.addListener(follow);

    /* ── 6. 移动端菜单 ───────────────────────────────────────── */
    var navToggle = document.getElementById('navToggle');
    var scrim = document.getElementById('navScrim');

    function setNav(open) {
        document.body.classList.toggle('nav-open', open);
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.setAttribute('aria-label', t(open ? 'a11y_menu_close' : 'a11y_menu'));
        scrim.hidden = !open;
    }
    navToggle.addEventListener('click', function () {
        setNav(!document.body.classList.contains('nav-open'));
        closeLang();
    });
    scrim.addEventListener('click', function () { setNav(false); });
    Array.prototype.forEach.call(document.querySelectorAll('.nav-links a'), function (a) {
        a.addEventListener('click', function () { setNav(false); });
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeLang(); setNav(false); }
    });

    /* ── 7. 入场动画 ─────────────────────────────────────────── */
    /* 规则：已经在视口内的元素直接显示，不依赖回调；
       IntersectionObserver 只负责屏外元素，另加两次兜底重扫，
       避免任何调度问题把整页留在 opacity:0 */
    function revealInViewport() {
        var vh = window.innerHeight || root.clientHeight;
        var shown = 0;
        Array.prototype.forEach.call(document.querySelectorAll('.reveal:not(.in)'), function (el) {
            var r = el.getBoundingClientRect();
            if (r.top < vh && r.bottom > 0) { el.classList.add('in'); shown++; }
        });
        return shown;
    }

    function observeReveals() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
            Array.prototype.forEach.call(document.querySelectorAll('.reveal:not(.in)'), function (el) { el.classList.add('in'); });
            return;
        }
        revealInViewport();
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in');
                    io.unobserve(entry.target);
                }
            });
        }, { rootMargin: '0px 0px -40px 0px', threshold: .08 });
        Array.prototype.forEach.call(document.querySelectorAll('.reveal:not(.in)'), function (el) { io.observe(el); });
        /* 兜底：回调被节流或延迟时，仍在视口内的内容必须出现 */
        setTimeout(revealInViewport, 400);
        window.addEventListener('load', revealInViewport);
    }

    window.SITE = SITE;
    window.SITE_RUNTIME = {
        t: t, pick: pick, lang: function () { return lang; },
        reveal: observeReveals, setLang: applyLang
    };

    applyLang(lang);
    observeReveals();
})();

/* ============================================================
   内容渲染工具：先转义、再排版
   —— 正文里的 URL 只允许 http/https/mailto 与站内相对路径
   ============================================================ */
function escHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function safeUrl(u) {
    var raw = String(u == null ? '' : u).trim();
    if (!raw) return '#';
    if (/^(https?:|mailto:|tel:)/i.test(raw)) return escHtml(raw);
    if (raw.charAt(0) === '#' || raw.charAt(0) === '/') return escHtml(raw);
    if (/^[\w.-]+\.html(#[\w-]*)?$/i.test(raw)) return escHtml(raw);
    return '#';
}

function inline(s) {
    return escHtml(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
            var external = /^(https?:|mailto:)/i.test(url);
            var attrs = external ? ' target="_blank" rel="noopener noreferrer"' : '';
            var arrow = external ? '<span class="ext-mark" aria-hidden="true"> ↗</span>' : '';
            return '<a href="' + safeUrl(url) + '"' + attrs + '>' + text + arrow + '</a>';
        });
}

function isExternal(u) { return /^(https?:|mailto:)/i.test(String(u || '')); }

/* 由结构化段落生成 HTML，供文章与项目描述复用 */
function renderBlocks(blocks) {
    if (!blocks) return '';
    var out = [];
    blocks.forEach(function (b) {
        if (b.h) out.push('<h2' + (b.id ? ' id="' + b.id + '"' : '') + '>' + inline(b.h) + '</h2>');
        else if (b.p) out.push('<p>' + inline(b.p) + '</p>');
        else if (b.quote) out.push('<blockquote>' + inline(b.quote) + '</blockquote>');
        else if (b.code) out.push('<pre class="code" tabindex="0"><code>' + escHtml(b.code) + '</code></pre>');
        else if (b.note) out.push('<aside class="note">' + inline(b.note) + '</aside>');
        else if (b.ul) out.push('<ul>' + b.ul.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>');
        else if (b.ol) out.push('<ol>' + b.ol.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ol>');
        else if (b.img) out.push('<figure class="post-figure">' +
            '<img src="' + escHtml(b.img.src) + '" alt="' + escHtml(b.img.alt || '') + '"' +
            (b.img.w ? ' width="' + Number(b.img.w) + '"' : '') +
            (b.img.h ? ' height="' + Number(b.img.h) + '"' : '') +
            ' loading="lazy" decoding="async" />' +
            (b.img.cap ? '<figcaption>' + inline(b.img.cap) + '</figcaption>' : '') +
            '</figure>');
    });
    return out.join('\n        ');
}
