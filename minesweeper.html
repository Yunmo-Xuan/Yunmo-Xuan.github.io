        /* 首屏前确定主题与语言，避免闪烁（FOUC） */
        (function () {
            var r = document.documentElement;
            r.className += ' js';
            var forced = /[?&]theme=(light|dark)/.exec(location.search);
            try {
                if (forced) { r.setAttribute('data-theme', forced[1]); }
                else {
                    var t = localStorage.getItem('preferredTheme');
                    if (t !== 'light' && t !== 'dark') {
                        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                    }
                    r.setAttribute('data-theme', t);
                }
                var l = localStorage.getItem('preferredLanguage');
                if (l) r.setAttribute('lang', l);
            } catch (e) {
                r.setAttribute('data-theme', forced ? forced[1] : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
            }
        })();

/* ---------- 开场动画 ---------- */
/* 视频本身就是 960×960 的方形，所以画框也做成方形：object-fit 不再产生黑边或裁切。
   底色用站点令牌而不是写死的夜空色，浅色主题下不会一大块黑压在米白页面上。 */
.intro {
    position: fixed; inset: 0; z-index: 300; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background:
        radial-gradient(110% 80% at 50% 4%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
        radial-gradient(90% 70% at 50% 104%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 60%),
        var(--bg);

.intro[hidden] { display: none !important; }
.intro-inner { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.2vh, 20px); }
/* 竖屏时允许画框略宽于屏幕，由视口裁掉两边各几十像素：

.intro-frame {
    position: relative; width: min(max(92vw, 54vh), 620px); aspect-ratio: 1; overflow: hidden;
    border-radius: clamp(18px, 3.4vh, 30px); background: var(--surface);
    box-shadow: 0 30px 80px -30px color-mix(in srgb, var(--accent) 55%, transparent),
                0 0 0 1px color-mix(in srgb, var(--text) 10%, transparent);
    display: grid;
}
.intro-frame > * { grid-area: 1 / 1; }
/* 首帧真的画出来才淡入视频，避免 poster 与画面之间硬切。
   z-index 是必需的：占位品牌带 infinite 动画会自成层叠上下文，同格绘制时会压在视频上面。 */
.intro-video { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1;
    opacity: 0; transition: opacity .5s ease; }
.intro-roll .intro-video { opacity: 1; }
/* 慢网时占位品牌保持呼吸，弹层不会变成一张静止的图 */
.intro-brand { display: grid; place-content: center; gap: 12px; justify-items: center; color: var(--muted);
    animation: intro-breathe 2.6s ease-in-out infinite; }
.intro-brand img { border-radius: 12px; }
.intro-side { display: flex; flex-direction: column; align-items: center; gap: clamp(9px, 1.8vh, 14px); width: min(max(92vw, 54vh), 620px); }
.intro-progress { width: 100%; height: 3px; border-radius: 2px; overflow: hidden;
    background: color-mix(in srgb, var(--text) 14%, transparent); }
.intro-progress i { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left;
    animation: intro-beat 1.4s linear both; }
/* 视频真的播起来了，进度才交给 currentTime，不再走这段占位节拍 */
.intro-roll .intro-progress i { animation: none; }
@keyframes intro-beat { from { transform: scaleX(0) } to { transform: scaleX(1) } }
.intro-name { margin: 0; font-size: clamp(1.1rem, 3vh, 1.5rem); font-weight: 700; letter-spacing: -.02em; color: var(--text); }
.intro-tag { margin: 0; font-size: clamp(.76rem, 1.7vh, .88rem); letter-spacing: .12em; color: var(--muted); }
.intro-skip { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));

/* 入场动画用 backwards 填充：结束后把 transform 交还给普通样式，退场才做得动微调缩放 */

.intro-side { animation: intro-up .5s .16s cubic-bezier(.2, .75, .2, 1) backwards; }

/* ---------- 入场动画 ---------- */
.js .reveal { opacity: 0; transform: translateY(14px); }
.js .reveal.in { opacity: 1; transform: none; transition: opacity .55s ease, transform .55s cubic-bezier(.22, .68, .44, 1); }
.js .reveal.d1 { transition-delay: .07s; }
.js .reveal.d2 { transition-delay: .14s; }
.js .reveal.d3 { transition-delay: .21s; }

/* ---------- 响应式 ---------- */
@media (max-width: 860px) {
    .nav-toggle { display: inline-flex; }
    .nav {
        position: absolute; inset: calc(100% + 1px) 0 auto 0; display: none; z-index: 91;

    }
    body.nav-open .nav { display: block; }
    .nav-links { flex-direction: column; align-items: stretch; gap: 0; padding: 10px 24px 18px; }
    .nav-links a { padding: 14px 4px; border-bottom: 1px solid var(--line); border-radius: 0; }
    .nav-links a:hover, .nav-links a[aria-current="page"] { background: transparent; }
    .nav-scrim { display: block; position: fixed; inset: var(--nav-h) 0 0; background: rgba(0, 0, 0, .28); opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s; z-index: 80; }
    body.nav-open .nav-scrim { opacity: 1; visibility: visible; }
    .page-head { padding-top: 42px; }
}
@media (max-width: 620px) {

    .filterbar .count { width: 100%; margin-inline-start: 0; }
}

/* 手势与滚动：关掉下拉刷新与滚动链，滚动条用站点自己的配色 */
html, body { overscroll-behavior-y: none; }
body { touch-action: manipulation; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) var(--surface-2); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--surface-2); }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 99px; border: 2px solid var(--surface-2); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .js .reveal { opacity: 1; transform: none; }
}

@media print {

    <div class="intro" id="introSplash" role="dialog" aria-modal="true" data-i18n-aria="a11y_intro" aria-label="站点开场动画" hidden>
        <div class="intro-inner">
            <div class="intro-frame" id="introFrame">
                <div class="intro-brand"><img src="assets/logo-mark.webp" alt="" width="44" height="44" /><span data-i18n="brand">云陌轩</span></div>
            </div>
            <div class="intro-side">
                <div class="intro-progress" aria-hidden="true"><i id="introBar"></i></div>
                <p class="intro-name" data-i18n="brand">云陌轩</p>
                <p class="intro-tag" data-i18n="intro_tag">个人作品与小游戏</p>
            </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm intro-skip" id="introSkip"><span data-i18n="intro_skip">跳过</span><kbd>Esc</kbd></button>
    </div>

    <script>
    (function () {
        var el = document.getElementById('introSplash');
        if (!el) return;
        var seen = false, reduced = false;
        try { seen = sessionStorage.getItem('yunmo.intro.seen') === '1'; } catch (e) {}
        try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (seen || reduced || /[?&]nosplash/.test(location.search)) { el.remove(); return; }
        /* 只有真的要播时才建 <video>，避免回访用户白拉一次素材 */
        var video = document.createElement('video');
        video.className = 'intro-video';
        video.id = 'introVideo';
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.setAttribute('aria-hidden', 'true');
        /* 首帧解码前先用品牌图顶着，不是一段黑 */
        video.poster = 'assets/logo.webp';
        video.src = 'assets/intro.mp4';
        document.getElementById('introFrame').append(video);
        el.hidden = false;
        document.documentElement.classList.add('intro-on', 'booting');
        /* 弹层期间背景不可交互也不可 Tab 进去，结束后把焦点还给原处。
           这段脚本在解析中途执行，#main 此刻还不存在，所以补一次 DOMContentLoaded 后再锁 */
        var LOCK = ['.site-header', '#main', '.site-footer'];
        var lastFocus = document.activeElement;
        var closed = false;
        function lock(on) {
            LOCK.forEach(function (sel) {
                var node = document.querySelector(sel);
                if (node) node.inert = on;
            });
        }
        lock(true);
        document.addEventListener('DOMContentLoaded', function () { if (!closed) lock(true); });
        var skip = document.getElementById('introSkip');
        /* 焦点必须进入弹层，否则 inert 只是把背景锁成谁也碰不到 */
        skip.focus();
        var bar = document.getElementById('introBar');
        var started = false;
        function done() {
            if (closed) return; closed = true;
            el.classList.add('intro-out');
            lock(false);
            setTimeout(function () {
                el.remove();
                document.documentElement.classList.remove('intro-on', 'booting', 'intro-roll');
                /* 入场动画交给页面自己演，别在弹层背后白白跑完 */
                try { document.dispatchEvent(new CustomEvent('yunmo:intro-closed')); } catch (e) {}
                if (lastFocus && lastFocus.focus) lastFocus.focus();
            }, 420);
        }
        video.addEventListener('ended', done);
        video.addEventListener('error', done);
        video.addEventListener('timeupdate', function () {
            /* MediaRecorder 出的 fragmented mp4 里 mvhd 时长偏短，比值必须夹住，否则进度条会冲过头 */
            if (bar && video.duration) bar.style.transform = 'scaleX(' + Math.min(1, video.currentTime / video.duration) + ')';
        });
        /* 真的画出画面才算“看过”，只是 play() 被允许不算；同时把视频淡进来 */
        video.addEventListener('playing', function () {
            started = true;
            document.documentElement.classList.add('intro-roll');
            try { sessionStorage.setItem('yunmo.intro.seen', '1'); } catch (e) {}
        });
        skip.addEventListener('click', done);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') done(); });
        var playing = video.play();
        if (playing && playing.then) playing.catch(done);
        /* 开场是一段"品牌节拍"，不是视频的等待页：
           2.2 秒内画不出首帧就带着动效收场（4G 实测首帧约 1.5 秒，这个窗口够它进来），
           绝不让人对着一张静止图干等。慢网络下不写 seen，下次还会再试。 */
        setTimeout(function () { if (!started) done(); }, 2200);
        setTimeout(done, 7000);
    })();
    </script>

window.PAGE_RENDER = function(ctx) {
        var frame = document.getElementById('embedFrame');
        var frameEl = document.getElementById('embedGame');
        var loading = document.getElementById('embedLoading');
        var button = document.getElementById('embedFull');
        frameEl.title = ctx.t('frame_label').replace('%s', ctx.t('game_name'));

        /* 打开这款游戏就记一笔，游戏室据此提示"再来一局" */
        try { localStorage.setItem('lastPlayedGame', id); } catch (e) {}

        function syncTheme() {
            var theme = document.documentElement.getAttribute('data-theme') || 'light';
            try { frameEl.contentWindow.postMessage({ type: 'yunmo-theme', theme: theme }, '*'); } catch (e) {}
        }
        function opened() {
            loading.hidden = true;
            syncTheme();
        }
        function ready() {
            try { return frameEl.contentDocument && frameEl.contentDocument.readyState === 'complete'; } catch (e) { return false; }
        }

        /* 监听器只注册一次：切语言会重跑 render，重复绑定会让"放大"一开一关互相抵消 */
        if (!window.EMBED_BOUND) {
            window.EMBED_BOUND = true;
            frameEl.addEventListener('load', opened);
            window.addEventListener('message', function (event) {
                var data = event.data;
                if (!data || typeof data !== 'object') return;
                if (data.type === 'yunmo-theme-request') syncTheme();
                if (data.type === 'yunmo-exit-fullscreen' && frame.classList.contains('is-full')) toggle(false);
            });
            button.addEventListener('click', function () { toggle(!frame.classList.contains('is-full')); });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && frame.classList.contains('is-full')) toggle(false);
            });
            new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        }
        function toggle(on) {
            frame.classList.toggle('is-full', on);
            document.body.classList.toggle('embed-full', on);
            button.setAttribute('aria-pressed', String(on));
            button.querySelector('span').textContent = ctx.t(on ? 'exitFullscreen' : 'fullscreen');
            if (on) frameEl.focus();

        toggle(frame.classList.contains('is-full'));   /* 语言切换后按钮文案跟着当前状态走 */
        if (ready()) opened();
        syncTheme();
    };

    var PAGE = window.PAGE_I18N || {};
    var T = {};
    LANGS.forEach(function (code) {
        T[code] = Object.assign({}, CHROME[code] || {}, PAGE[code] || {});
    });

    /* ── 3. 存储（隐私模式下 localStorage 会抛错） ───────────── */
    function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function write(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

    /* ── 4. 多语言 ───────────────────────────────────────────── */

        if (LANGS.indexOf(nav) >= 0) lang = nav;
        else if (nav.indexOf('zh') === 0) lang = (/(TW|HK|MO)/.test(nav) ? 'zh-TW' : 'zh-CN');
        else if (nav.indexOf('ja') === 0) lang = 'ja';
        else if (nav.indexOf('en') === 0) lang = 'en';
        else lang = 'zh-CN';
    }

    function t(key) {
        var value = T[lang][key];
        if (value === undefined) value = T['zh-CN'][key];
        return value;
    }

    /* 从数据表里取当前语言的文案，取不到则回退 zh-CN 再回退首个可用值 */
    function pick(fields) {
        if (!fields) return '';
        if (typeof fields === 'string') return fields;
        var value = fields[lang];
        if (value === undefined) value = fields['zh-CN'];
        if (value === undefined) {
            var keys = Object.keys(fields);
            value = keys.length ? fields[keys[0]] : '';
        }
        return value;
    }

    /* 字典内容都是本文件内手写的静态文案，不含任何用户输入，
       因此允许 <strong>/<br/> 这类排版标记 */
    function applyText(el, key) {
        var value = t(key);
        if (typeof value === 'string') el.innerHTML = value;
    }

    function applyLang(next) {
        if (LANGS.indexOf(next) >= 0) lang = next;
        write('preferredLanguage', lang);
        root.setAttribute('lang', lang);
        document.title = t('doc_title');

        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
            applyText(el, el.getAttribute('data-i18n'));
        });

        });

            if (typeof desc === 'string') metaDesc.setAttribute('content', desc);

        if (label) label.textContent = LANG_LABEL[lang] || lang;

        }

    var langDropdown = document.getElementById('langDropdown');

        langDropdown.classList.remove('show');
        langToggle.setAttribute('aria-expanded', 'false');
    }

            if (first) first.focus();

        item.addEventListener('click', function (e) {
            e.preventDefault();
            applyLang(item.getAttribute('data-lang'));

            langToggle.focus();
        });
    });

    });

    var themeToggle = document.getElementById('themeToggle');
    var metaTheme = document.getElementById('metaThemeColor');
    var themeExplicit = read('preferredTheme') === 'light' || read('preferredTheme') === 'dark';

    function applyTheme(mode) {
        root.setAttribute('data-theme', mode);
        if (metaTheme) metaTheme.setAttribute('content', mode === 'dark' ? '#0e1116' : '#faf9f8');

        themeExplicit = true;

    var follow = function (e) { if (!themeExplicit) applyTheme(e.matches ? 'dark' : 'light'); };

    else if (mq.addListener) mq.addListener(follow);

        closeLang();
    });
    scrim.addEventListener('click', function () { setNav(false); });
    Array.prototype.forEach.call(document.querySelectorAll('.nav-links a'), function (a) {
        a.addEventListener('click', function () { setNav(false); });
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeLang(); setNav(false); }
    });

    /* ── 7. 入场动画 ─────────────────────────────────────────── */
    /* 规则：已经在视口内的元素直接显示，不依赖回调；
       IntersectionObserver 只负责屏外元素，另加两次兜底重扫，
       避免任何调度问题把整页留在 opacity:0 */
    function revealInViewport() {
        /* 开场弹层还盖着时不要放行入场动画：那样等内容露出来时已经演完了，交接会很生硬 */
        if (root.classList.contains('intro-on')) return 0;
        var vh = window.innerHeight || root.clientHeight;
        var shown = 0;
        Array.prototype.forEach.call(document.querySelectorAll('.reveal:not(.in)'), function (el) {
            var r = el.getBoundingClientRect();
            if (r.top < vh && r.bottom > 0) { el.classList.add('in'); shown++; }
        });
        return shown;
    }

    function observeReveals() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
            Array.prototype.forEach.call(document.querySelectorAll('.reveal:not(.in)'), function (el) { el.classList.add('in'); });
            return;
        }
        revealInViewport();
        var io = new IntersectionObserver(function (entries) {
            if (root.classList.contains('intro-on')) return;
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in');
                    io.unobserve(entry.target);
                }
            });
        }, { rootMargin: '0px 0px -40px 0px', threshold: .08 });
        Array.prototype.forEach.call(document.querySelectorAll('.reveal:not(.in)'), function (el) { io.observe(el); });
        /* 兜底：回调被节流或延迟时，仍在视口内的内容必须出现 */
        setTimeout(revealInViewport, 400);
        window.addEventListener('load', revealInViewport);
        document.addEventListener('yunmo:intro-closed', revealInViewport);
    }

    window.SITE = SITE;
    window.SITE_RUNTIME = {
        t: t, pick: pick, lang: function () { return lang; },
        reveal: observeReveals, setLang: applyLang
    };

    applyLang(lang);
    observeReveals();
})();

/* ============================================================
   内容渲染工具：先转义、再排版
   —— 正文里的 URL 只允许 http/https/mailto 与站内相对路径
   ============================================================ */
function escHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function safeUrl(u) {
    var raw = String(u == null ? '' : u).trim();
    if (!raw) return '#';
    if (/^(https?:|mailto:|tel:)/i.test(raw)) return escHtml(raw);
    if (raw.charAt(0) === '#' || raw.charAt(0) === '/') return escHtml(raw);
    if (/^[\w.-]+\.html(#[\w-]*)?$/i.test(raw)) return escHtml(raw);
    return '#';
}

function inline(s) {
    return escHtml(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, text, url) {
            var external = /^(https?:|mailto:)/i.test(url);
            var attrs = external ? ' target="_blank" rel="noopener noreferrer"' : '';
            var arrow = external ? '<span class="ext-mark" aria-hidden="true"> ↗</span>' : '';
            return '<a href="' + safeUrl(url) + '"' + attrs + '>' + text + arrow + '</a>';
        });
}

function isExternal(u) { return /^(https?:|mailto:)/i.test(String(u || '')); }

/* 由结构化段落生成 HTML，供正文与项目描述复用 */
function renderBlocks(blocks) {
    if (!blocks) return '';
    var out = [];
    blocks.forEach(function (b) {
        if (b.h) out.push('<h2' + (b.id ? ' id="' + b.id + '"' : '') + '>' + inline(b.h) + '</h2>');
        else if (b.p) out.push('<p>' + inline(b.p) + '</p>');
        else if (b.quote) out.push('<blockquote>' + inline(b.quote) + '</blockquote>');
        else if (b.code) out.push('<pre class="code" tabindex="0"><code>' + escHtml(b.code) + '</code></pre>');
        else if (b.note) out.push('<aside class="note">' + inline(b.note) + '</aside>');
        else if (b.ul) out.push('<ul>' + b.ul.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>');
        else if (b.ol) out.push('<ol>' + b.ol.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ol>');
        else if (b.img) out.push('<figure class="post-figure">' +
            '<img src="' + escHtml(b.img.src) + '" alt="' + escHtml(b.img.alt || '') + '"' +
            (b.img.w ? ' width="' + Number(b.img.w) + '"' : '') +
            (b.img.h ? ' height="' + Number(b.img.h) + '"' : '') +
            ' loading="lazy" decoding="async" />' +
            (b.img.cap ? '<figcaption>' + inline(b.img.cap) + '</figcaption>' : '') +
            '</figure>');
    });
    return out.join('\n        ');
}
