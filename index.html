<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 · 云陌轩的个人空间</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #faf9f8;
            color: #1e1e1e;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background 0.3s;
        }

        .bg-glow {
            position: fixed;
            top: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 28px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* 导航 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0066ff, #00c6fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            font-weight: 500;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #2c2c2c;
            transition: color 0.2s, opacity 0.2s;
            font-size: 1rem;
        }

        .nav-links a:hover {
            color: #0066ff;
        }

        .btn-outline {
            border: 1.5px solid #1e1e1e;
            padding: 8px 20px;
            border-radius: 40px;
            transition: all 0.25s;
        }

        .btn-outline:hover {
            background: #1e1e1e;
            color: #fff !important;
        }

        /* 语言切换 */
        .lang-switcher {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .lang-current {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(0,0,0,0.02);
            transition: background 0.2s;
            font-weight: 500;
            text-decoration: none;
            color: #2c2c2c;
        }

        .lang-current:hover {
            background: rgba(0,0,0,0.05);
        }

        .lang-dropdown {
            position: absolute;
            top: 110%;
            right: 0;
            background: white;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            list-style: none;
            padding: 8px 0;
            min-width: 140px;
            display: none;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .lang-dropdown li a {
            display: block;
            padding: 10px 20px;
            text-decoration: none;
            color: #1e1e1e;
            font-size: 0.95rem;
            transition: background 0.15s;
            white-space: nowrap;
        }

        .lang-dropdown li a:hover {
            background: #f0f4ff;
            color: #0066ff;
        }

        .lang-dropdown.show {
            display: block;
        }

        /* Hero */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 60px 0 50px;
        }

        .hero-badge {
            background: rgba(0, 102, 255, 0.10);
            color: #0066ff;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            transition: background 0.25s;
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .hero h1 .gradient-text {
            background: linear-gradient(145deg, #0066ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.25rem;
            color: #3d3d3d;
            max-width: 600px;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1e1e1e;
            color: #fff;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: #0066ff;
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0,102,255,0.25);
        }

        .btn-secondary {
            background: transparent;
            color: #1e1e1e;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            border: 1.5px solid #d0d0d0;
            transition: border 0.25s, background 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary:hover {
            border-color: #0066ff;
            background: rgba(0, 102, 255, 0.04);
        }

        /* 卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
            padding: 40px 0 60px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 10px;
        }

        .feature-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .feature-card {
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.02);
            height: 100%;
            transition: inherit;
            backdrop-filter: blur(4px);
        }

        .feature-card-link:hover .feature-card {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        .feature-card i {
            font-size: 2.4rem;
            color: #0066ff;
            margin-bottom: 14px;
            display: inline-block;
            transition: transform 0.2s;
        }

        .feature-card-link:hover .feature-card i {
            transform: scale(1.1);
        }

        .feature-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .feature-card p {
            color: #4a4a4a;
            font-size: 0.98rem;
        }

        /* 页脚 */
        .footer {
            margin-top: auto;
            padding: 32px 0 28px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.95rem;
            color: #5a5a5a;
        }

        .footer-socials a {
            color: #3d3d3d;
            margin-left: 22px;
            font-size: 1.3rem;
            transition: color 0.2s, transform 0.2s;
            display: inline-block;
        }

        .footer-socials a:hover {
            color: #0066ff;
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {
            .hero h1 {
                font-size: 2.6rem;
            }
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
            }
            .hero {
                padding: 30px 0 20px;
            }
            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
            }
            .footer {
                flex-direction: column;
                text-align: center;
            }
            .footer-socials a {
                margin: 0 12px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        <nav class="navbar">
            <span class="logo">✦ 云陌轩</span>
            <ul class="nav-links">
                <li><a href="/" data-i18n="nav_home">首页</a></li>
                <li><a href="/blog.html" data-i18n="nav_blog">文章</a></li>
                <li><a href="/projects.html" data-i18n="nav_projects">项目</a></li>

                <li class="lang-switcher">
                    <a href="#" class="lang-current" id="langToggle">
                        <i class="fas fa-globe"></i>
                        <span id="currentLangLabel">简</span>
                    </a>
                    <ul class="lang-dropdown" id="langDropdown">
                        <li><a href="#" data-lang="zh-CN">简体中文</a></li>
                        <li><a href="#" data-lang="zh-TW">繁體中文</a></li>
                        <li><a href="#" data-lang="en">English</a></li>
                        <li><a href="#" data-lang="ja">日本語</a></li>
                    </ul>
                </li>

                <li><a href="mailto:your@email.com" class="btn-outline" data-i18n="nav_contact">联系</a></li>
            </ul>
        </nav>

        <section class="hero">
            <span class="hero-badge" data-i18n="hero_badge">
                <i class="fas fa-code" style="margin-right: 6px;"></i> 基于 GitHub Pages
            </span>
            <h1>
                <span data-i18n="hero_title_1">打造属于你的</span><br />
                <span class="gradient-text" data-i18n="hero_title_2">数字空间</span>
            </h1>
            <p data-i18n="hero_desc">
                你好，我是 <strong>云陌轩</strong> —— 这里是我用 HTML 和 CSS 搭建的小角落。简洁、干净，就像一张白纸，等待书写。
            </p>
            <div class="hero-actions">
                <a href="/projects.html" class="btn-primary" data-i18n="btn_explore">
                    <i class="fas fa-rocket"></i> 开始探索
                </a>
                <a href="https://github.com/你的用户名" class="btn-secondary" target="_blank" rel="noopener noreferrer" data-i18n="btn_github">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </section>

        <!-- 三个卡片 -->
        <div class="features">
            <a href="/games.html" class="feature-card-link">
                <div class="feature-card">
                    <i class="fas fa-gamepad"></i>
                    <h3 data-i18n="card1_title">玩点游戏</h3>
                    <p data-i18n="card1_desc">各种有趣的小游戏，放松一下。</p>
                </div>
            </a>
            <a href="/downloads.html" class="feature-card-link">
                <div class="feature-card">
                    <i class="fas fa-download"></i>
                    <h3 data-i18n="card2_title">软件下载</h3>
                    <p data-i18n="card2_desc">精选实用软件，安全下载。</p>
                </div>
            </a>
            <a href="/other.html" class="feature-card-link">
                <div class="feature-card">
                    <i class="fas fa-ellipsis-h"></i>
                    <h3 data-i18n="card3_title">其他</h3>
                    <p data-i18n="card3_desc">杂项内容，更多精彩。</p>
                </div>
            </a>
        </div>

        <footer class="footer">
            <span data-i18n="footer_text">© 2026 · 用 ❤️ 和 GitHub Pages 构建</span>
            <div class="footer-socials">
                <a href="https://github.com/你的用户名" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="/feed.xml" aria-label="RSS"><i class="fas fa-rss"></i></a>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            const translations = {
                'zh-CN': {
                    nav_home: '首页',
                    nav_blog: '文章',
                    nav_projects: '项目',
                    nav_contact: '联系',
                    hero_badge: '<i class="fas fa-code" style="margin-right: 6px;"></i> 基于 GitHub Pages',
                    hero_title_1: '打造属于你的',
                    hero_title_2: '数字空间',
                    hero_desc: '你好，我是 <strong>云陌轩</strong> —— 这里是我用 HTML 和 CSS 搭建的小角落。简洁、干净，就像一张白纸，等待书写。',
                    btn_explore: '<i class="fas fa-rocket"></i> 开始探索',
                    btn_github: '<i class="fab fa-github"></i> GitHub',
                    card1_title: '玩点游戏',
                    card1_desc: '各种有趣的小游戏，放松一下。',
                    card2_title: '软件下载',
                    card2_desc: '精选实用软件，安全下载。',
                    card3_title: '其他',
                    card3_desc: '杂项内容，更多精彩。',
                    footer_text: '© 2026 · 用 ❤️ 和 GitHub Pages 构建'
                },
                'zh-TW': {
                    nav_home: '首頁',
                    nav_blog: '文章',
                    nav_projects: '項目',
                    nav_contact: '聯絡',
                    hero_badge: '<i class="fas fa-code" style="margin-right: 6px;"></i> 基於 GitHub Pages',
                    hero_title_1: '打造屬於你的',
                    hero_title_2: '數位空間',
                    hero_desc: '你好，我是 <strong>云陌軒</strong> —— 這裡是我用 HTML 和 CSS 搭建的小角落。簡潔、乾淨，就像一張白紙，等待書寫。',
                    btn_explore: '<i class="fas fa-rocket"></i> 開始探索',
                    btn_github: '<i class="fab fa-github"></i> GitHub',
                    card1_title: '玩點遊戲',
                    card1_desc: '各種有趣的小遊戲，放鬆一下。',
                    card2_title: '軟體下載',
                    card2_desc: '精選實用軟體，安全下載。',
                    card3_title: '其他',
                    card3_desc: '雜項內容，更多精彩。',
                    footer_text: '© 2026 · 用 ❤️ 與 GitHub Pages 建構'
                },
                'en': {
                    nav_home: 'Home',
                    nav_blog: 'Blog',
                    nav_projects: 'Projects',
                    nav_contact: 'Contact',
                    hero_badge: '<i class="fas fa-code" style="margin-right: 6px;"></i> Powered by GitHub Pages',
                    hero_title_1: 'Build your own',
                    hero_title_2: 'digital space',
                    hero_desc: 'Hi, I’m <strong>Yun Moxuan</strong> — a little corner built with HTML and CSS. Clean, simple, like a blank canvas waiting to be written on.',
                    btn_explore: '<i class="fas fa-rocket"></i> Start Exploring',
                    btn_github: '<i class="fab fa-github"></i> GitHub',
                    card1_title: 'Play Games',
                    card1_desc: 'Fun little games to relax.',
                    card2_title: 'Software Downloads',
                    card2_desc: 'Selected useful software, safe downloads.',
                    card3_title: 'Other',
                    card3_desc: 'Miscellaneous content, more to explore.',
                    footer_text: '© 2026 · Built with ❤️ and GitHub Pages'
                },
                'ja': {
                    nav_home: 'ホーム',
                    nav_blog: 'ブログ',
                    nav_projects: 'プロジェクト',
                    nav_contact: 'お問い合わせ',
                    hero_badge: '<i class="fas fa-code" style="margin-right: 6px;"></i> GitHub Pages で公開',
                    hero_title_1: 'あなただけの',
                    hero_title_2: 'デジタル空間',
                    hero_desc: 'こんにちは、<strong>云陌軒</strong> です。HTMLとCSSで作った小さな場所。シンプルでクリーン、まるで白いキャンバスのように。',
                    btn_explore: '<i class="fas fa-rocket"></i> 探索を始める',
                    btn_github: '<i class="fab fa-github"></i> GitHub',
                    card1_title: 'ゲームを遊ぶ',
                    card1_desc: '楽しい小さなゲームでリラックス。',
                    card2_title: 'ソフトウェアダウンロード',
                    card2_desc: '厳選された便利なソフトウェア、安全にダウンロード。',
                    card3_title: 'その他',
                    card3_desc: 'その他のコンテンツ、さらに探索。',
                    footer_text: '© 2026 · ❤️ と GitHub Pages で作成'
                }
            };

            const langToggle = document.getElementById('langToggle');
            const langDropdown = document.getElementById('langDropdown');
            const currentLangLabel = document.getElementById('currentLangLabel');

            let currentLang = localStorage.getItem('preferredLanguage') || 'zh-CN';

            function setLanguage(lang) {
                const dict = translations[lang];
                if (!dict) return;

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) {
                        el.innerHTML = dict[key];
                    }
                });

                const labels = { 'zh-CN': '简', 'zh-TW': '繁', 'en': 'EN', 'ja': '日' };
                currentLangLabel.textContent = labels[lang] || lang;
                localStorage.setItem('preferredLanguage', lang);
                currentLang = lang;
                document.documentElement.lang = lang;
            }

            langToggle.addEventListener('click', function(e) {
                e.preventDefault();
                langDropdown.classList.toggle('show');
            });

            langDropdown.querySelectorAll('a[data-lang]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const lang = this.getAttribute('data-lang');
                    setLanguage(lang);
                    langDropdown.classList.remove('show');
                });
            });

            document.addEventListener('click', function(e) {
                if (!langToggle.contains(e.target) && !langDropdown.contains(e.target)) {
                    langDropdown.classList.remove('show');
                }
            });

            setLanguage(currentLang);
        })();
    </script>
</body>
</html>
