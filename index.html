<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页 · 我的个人空间</title>
    <!-- 使用 Font Awesome 图标库 (免费) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- 全局重置 & 字体 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #faf9f8;
            color: #1e1e1e;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 柔和的渐变背景装饰 */
        .bg-glow {
            position: fixed;
            top: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 102, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 28px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ---------- 导航栏 ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #0066ff, #00c6fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
            font-weight: 500;
        }

        .nav-links a {
            text-decoration: none;
            color: #2c2c2c;
            transition: color 0.2s;
            font-size: 1rem;
        }

        .nav-links a:hover {
            color: #0066ff;
        }

        .btn-outline {
            border: 1.5px solid #1e1e1e;
            padding: 8px 20px;
            border-radius: 40px;
            transition: all 0.25s;
        }

        .btn-outline:hover {
            background: #1e1e1e;
            color: #fff !important;
        }

        /* ---------- 主横幅 (Hero) ---------- */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 60px 0 50px;
        }

        .hero-badge {
            background: rgba(0, 102, 255, 0.10);
            color: #0066ff;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .hero h1 span {
            background: linear-gradient(145deg, #0066ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.25rem;
            color: #3d3d3d;
            max-width: 600px;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #1e1e1e;
            color: #fff;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.25s, transform 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: #0066ff;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            color: #1e1e1e;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            border: 1.5px solid #d0d0d0;
            transition: border 0.25s, background 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary:hover {
            border-color: #0066ff;
            background: rgba(0, 102, 255, 0.04);
        }

        /* ---------- 技能 / 特点卡片 ---------- */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 30px;
            padding: 40px 0 60px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            margin-top: 10px;
        }

        .feature-card {
            background: #ffffff;
            padding: 28px 22px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s, box-shadow 0.3s;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        .feature-card i {
            font-size: 2.4rem;
            color: #0066ff;
            margin-bottom: 14px;
            display: inline-block;
        }

        .feature-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .feature-card p {
            color: #4a4a4a;
            font-size: 0.98rem;
        }

        /* ---------- 页脚 ---------- */
        .footer {
            margin-top: auto;
            padding: 32px 0 28px;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.95rem;
            color: #5a5a5a;
        }

        .footer-socials a {
            color: #3d3d3d;
            margin-left: 22px;
            font-size: 1.3rem;
            transition: color 0.2s;
        }

        .footer-socials a:hover {
            color: #0066ff;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 700px) {
            .hero h1 {
                font-size: 2.6rem;
            }

            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .nav-links {
                gap: 20px;
                flex-wrap: wrap;
            }

            .hero {
                padding: 30px 0 20px;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }

            .footer-socials a {
                margin: 0 12px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景光晕装饰 (纯视觉) -->
    <div class="bg-glow"></div>

    <div class="container">
        <!-- 导航 -->
        <nav class="navbar">
            <span class="logo">✦ 小站</span>
            <ul class="nav-links">
                <li><a href="#">首页</a></li>
                <li><a href="#">文章</a></li>
                <li><a href="#">项目</a></li>
                <li><a href="#" class="btn-outline">联系</a></li>
            </ul>
        </nav>

        <!-- 主内容 -->
        <section class="hero">
            <span class="hero-badge"><i class="fas fa-code" style="margin-right: 6px;"></i> 基于 GitHub Pages</span>
            <h1>
                打造属于你的<br />
                <span>数字空间</span>
            </h1>
            <p>
                你好，我是 <strong>Alex</strong> —— 这里是我用 HTML 和 CSS 搭建的小角落。
                简洁、干净，就像一张白纸，等待书写。
            </p>
            <div class="hero-actions">
                <a href="#" class="btn-primary">
                    <i class="fas fa-rocket"></i> 开始探索
                </a>
                <a href="#" class="btn-secondary">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </section>

        <!-- 特点卡片 -->
        <div class="features">
            <div class="feature-card">
                <i class="fas fa-palette"></i>
                <h3>极简美学</h3>
                <p>干净、留白、聚焦内容。没有多余的干扰，只有纯粹的阅读体验。</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-bolt"></i>
                <h3>天生快速</h3>
                <p>纯静态页面，无需数据库，CDN 全球分发，加载几乎瞬开。</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-shield-alt"></i>
                <h3>自由 & 安全</h3>
                <p>完全由你掌控，没有第三方跟踪，自带 HTTPS，安心发布。</p>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <span>&copy; 2026 · 用 ❤️ 和 GitHub Pages 构建</span>
            <div class="footer-socials">
                <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="RSS"><i class="fas fa-rss"></i></a>
            </div>
        </footer>
    </div>

</body>
</html>
